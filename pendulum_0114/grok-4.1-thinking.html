<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Pendulum Chaotic Simulation</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: black;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let px = width / 2;
        let cy = height * 0.1;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            px = width / 2;
            cy = height * 0.1;
        });

        // Physics parameters
        const g = 981;      // Gravity (tuned for pixel scale and visual speed)
        const l1 = 200;     // Length of first pendulum
        const l2 = 200;     // Length of second pendulum
        const m1 = 1;       // Mass of first bob (ratios matter more than absolute values)
        const m2 = 1;       // Mass of second bob

        // Initial state (slightly off unstable upward equilibrium for chaotic motion)
        let theta1 = Math.PI + 0.01;
        let theta2 = Math.PI;
        let omega1 = 0;
        let omega2 = 0;

        // Current and previous tip positions
        let x1, y1, x2, y2;
        let prev_x2, prev_y2;

        // Rainbow hue for neon trail
        let hue = 0;

        // Fixed timestep for stable integration
        const MS_PER_UPDATE = 10; // dt ≈ 0.01s
        let lag = 0;
        let lastTime = performance.now();

        function update(dt) {
            const delta = theta1 - theta2;
            const sin_delta = Math.sin(delta);
            const cos_delta = Math.cos(delta);
            const cos_2delta = Math.cos(2 * delta);

            const den = l1 * (2 * m1 + m2 - m2 * cos_2delta);

            // Angular accelerations (standard Lagrangian-derived equations)
            const a1 = (-g * (2 * m1 + m2) * Math.sin(theta1) -
                        m2 * g * Math.sin(theta1 - 2 * theta2) -
                        2 * sin_delta * m2 * (omega2 ** 2 * l2 + omega1 ** 2 * l1 * cos_delta)) / den;

            const a2 = (2 * sin_delta * (omega1 ** 2 * l1 * (m1 + m2) +
                        g * (m1 + m2) * Math.cos(theta1) +
                        omega2 ** 2 * l2 * m2 * cos_delta)) /
                        (l2 * (2 * m1 + m2 - m2 * cos_2delta));

            // Euler integration
            omega1 += a1 * dt;
            omega2 += a2 * dt;
            theta1 += omega1 * dt;
            theta2 += omega2 * dt;
        }

        function computePositions() {
            x1 = px + l1 * Math.sin(theta1);
            y1 = cy + l1 * Math.cos(theta1);
            x2 = x1 + l2 * Math.sin(theta2);
            y2 = y1 + l2 * Math.cos(theta2);
        }

        function draw() {
            // Gentle fade for trailing effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.025)';
            ctx.fillRect(0, 0, width, height);

            // Rainbow neon trail at the tip
            hue = (hue + 1) % 360;
            const color = `hsl(${hue}, 100%, 50%)`;

            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 20;
            ctx.shadowColor = color;
            ctx.strokeStyle = color;

            ctx.beginPath();
            ctx.moveTo(prev_x2, prev_y2);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // Pendulum arms and bobs (no glow)
            ctx.shadowBlur = 0;
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';

            ctx.beginPath();
            ctx.moveTo(px, cy);
            ctx.lineTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            const bobRadius = 15;
            ctx.beginPath();
            ctx.arc(x1, y1, bobRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x2, y2, bobRadius, 0, Math.PI * 2);
            ctx.fill();

            // Pivot point
            ctx.beginPath();
            ctx.arc(px, cy, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate(currentTime) {
            const elapsed = currentTime - lastTime;
            lastTime = currentTime;
            lag += elapsed;

            while (lag >= MS_PER_UPDATE) {
                update(MS_PER_UPDATE / 1000);
                lag -= MS_PER_UPDATE;
            }

            computePositions();
            draw();

            // Update previous tip position for next trail segment
            prev_x2 = x2;
            prev_y2 = y2;

            requestAnimationFrame(animate);
        }

        // Initial setup
        computePositions();
        prev_x2 = x2;
        prev_y2 = y2;

        requestAnimationFrame(animate);
    </script>
</body>
</html>
