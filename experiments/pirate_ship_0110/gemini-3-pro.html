<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Ship Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #5d4037;
            box-shadow: 4px 4px 0px #3e2723;
            pointer-events: none;
            user-select: none;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 20px;
            text-transform: uppercase;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }

        p { margin: 5px 0; font-size: 14px; font-weight: bold; }
        .controls { color: #d32f2f; }
        
        #message-area {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

<div id="ui">
    <h1>The Black Canvas</h1>
    <p>Speed: <span id="speedVal">0</span> knots</p>
    <p class="controls">← / → : Throttle</p>
    <p class="controls">SPACE : Fire Broadside</p>
</div>

<div id="message-area">ARRR! FIRE IN THE HOLE!</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const uiSpeed = document.getElementById('speedVal');
    const msgArea = document.getElementById('message-area');

    let width, height;
    let time = 0;

    // Game State
    const ship = {
        x: 0, 
        y: 0,
        speed: 2,
        width: 160,
        height: 50,
        angle: 0,
        cannonCooldown: 0
    };

    const particles = [];
    const cannonballs = [];

    // Wave Configuration
    const waves = [
        { amp: 30, length: 0.008, speed: 0.03 },
        { amp: 15, length: 0.02, speed: 0.06 },
        { amp: 5, length: 0.05, speed: 0.12 }
    ];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        ship.x = width / 2;
    }

    window.addEventListener('resize', resize);
    resize();

    // Inputs
    const keys = {};
    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'Space') fireCannon();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function fireCannon() {
        if (ship.cannonCooldown > 0) return;
        
        ship.cannonCooldown = 30;
        
        // Visual text trigger
        msgArea.style.opacity = 1;
        setTimeout(() => msgArea.style.opacity = 0, 800);

        // Spawn cannonballs
        for(let i=0; i<3; i++) {
            cannonballs.push({
                x: ship.x + (i * 30) - 30,
                y: ship.y - 10,
                vx: 8 + Math.random() * 4,
                vy: -3 + Math.random() * 2, 
                life: 100
            });
            
            // Smoke particles
            for(let j=0; j<10; j++) {
                particles.push({
                    x: ship.x + (i * 30) - 30,
                    y: ship.y - 10,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 1) * 3,
                    life: 60,
                    size: Math.random() * 10 + 5,
                    color: `rgba(200, 200, 200, ${Math.random()})`,
                    type: 'smoke'
                });
            }
        }
        
        // Recoil
        ship.x -= 5;
    }

    // --- Physics & Helpers ---

    function getWaterHeight(x) {
        let y = 0;
        // Superposition of sine waves
        waves.forEach(w => {
            y += Math.sin(x * w.length + time * w.speed) * w.amp;
        });
        return (height / 1.8) + y;
    }

    function updatePhysics() {
        // Ship Movement
        if (keys['ArrowRight']) ship.speed = Math.min(ship.speed + 0.1, 8);
        else if (keys['ArrowLeft']) ship.speed = Math.max(ship.speed - 0.1, -2);
        else ship.speed *= 0.98; // Friction

        // Move "world" (simulate movement by shifting phase, strictly speaking we are static x, but let's shift waves)
        // Actually, let's keep ship mostly centered but allow slight x movement
        
        // To make it look like we are moving, we add speed to the time multiplier of waves? 
        // Or simpler: We just animate waves, and ship speed adds to wave phase offset.
        // For this 2D sim, let's just interpret ship.speed as additional wave speed.
        
        // Calculate Ship Position & Angle
        // We sample two points on the water to determine angle
        const sternX = ship.x - 40;
        const bowX = ship.x + 40;
        
        const waterY_Stern = getWaterHeight(sternX + (time * ship.speed * 5)); 
        const waterY_Bow = getWaterHeight(bowX + (time * ship.speed * 5));
        
        const avgY = (waterY_Stern + waterY_Bow) / 2;
        ship.y = avgY - 15; // Sit slightly in water
        
        // Calculate angle: tan(theta) = dy / dx
        ship.angle = Math.atan2(waterY_Bow - waterY_Stern, 80);

        if (ship.cannonCooldown > 0) ship.cannonCooldown--;
        
        // Create wake particles
        if (Math.abs(ship.speed) > 1 && Math.random() > 0.5) {
             particles.push({
                x: ship.x - 60,
                y: avgY + 10,
                vx: -2,
                vy: -1,
                life: 40,
                size: Math.random() * 5,
                color: 'rgba(255, 255, 255, 0.8)',
                type: 'foam'
            });
        }
    }

    // --- Drawing ---

    function drawSky() {
        // Sun
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(width - 100, 100, 60, 0, Math.PI * 2);
        ctx.fill();
        
        // Clouds
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        const cloudOffset = time * 0.5;
        for(let i=0; i<5; i++) {
            let cx = ((i * 300) + cloudOffset) % (width + 400) - 200;
            let cy = 100 + (i * 30);
            ctx.beginPath();
            ctx.arc(cx, cy, 40, 0, Math.PI * 2);
            ctx.arc(cx + 30, cy - 10, 50, 0, Math.PI * 2);
            ctx.arc(cx + 60, cy, 40, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawWater() {
        ctx.fillStyle = 'rgba(0, 105, 148, 0.8)';
        ctx.beginPath();
        ctx.moveTo(0, height);
        
        const phaseOffset = time * ship.speed * 5;

        for (let x = 0; x <= width; x += 10) {
            ctx.lineTo(x, getWaterHeight(x + phaseOffset));
        }
        
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();
        
        // Second layer (darker, background waves)
        ctx.fillStyle = 'rgba(0, 60, 100, 0.5)';
        ctx.beginPath();
        ctx.moveTo(0, height);
        for (let x = 0; x <= width; x += 20) {
            // Offset logic for parallax
            let y = 0;
            waves.forEach(w => {
                 y += Math.sin((x + 100) * w.length + (time + 10) * w.speed) * (w.amp * 1.2);
            });
            ctx.lineTo(x, (height / 1.8) + 20 + y);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();
    }

    function drawShip() {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);
        
        // Hull
        ctx.fillStyle = '#3E2723';
        ctx.beginPath();
        ctx.moveTo(-60, -20); // Top left stern
        ctx.lineTo(60, -20);  // Top right bow
        ctx.quadraticCurveTo(80, 0, 50, 30); // Bow curve
        ctx.lineTo(-40, 30);  // Bottom stern
        ctx.quadraticCurveTo(-70, 0, -60, -20); // Stern curve
        ctx.fill();
        
        // Deck detail
        ctx.strokeStyle = '#5D4037';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-60, -15);
        ctx.lineTo(60, -15);
        ctx.stroke();

        // Masts
        ctx.fillStyle = '#28150e';
        // Main mast
        ctx.fillRect(-10, -140, 8, 120);
        // Fore mast
        ctx.fillRect(30, -100, 6, 80);
        // Aft mast
        ctx.fillRect(-40, -90, 6, 70);

        // Sails (White with slight curve)
        ctx.fillStyle = '#F5F5F5';
        ctx.strokeStyle = '#ccc';
        
        // Main Sail
        ctx.beginPath();
        ctx.moveTo(-10, -130);
        ctx.quadraticCurveTo(20, -130, 20, -40); // Billowing effect
        ctx.lineTo(-10, -40);
        ctx.fill();
        ctx.stroke();

        // Fore Sail
        ctx.beginPath();
        ctx.moveTo(30, -90);
        ctx.quadraticCurveTo(50, -90, 50, -30);
        ctx.lineTo(30, -30);
        ctx.fill();
        ctx.stroke();

        // Pirate Flag (Jolly Roger style approximation)
        ctx.fillStyle = '#000';
        ctx.fillRect(-10, -160, 40, 25);
        
        // Skull (white dot)
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(10, -150, 6, 0, Math.PI*2);
        ctx.fill();
        // Crossbones (lines)
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(5, -155); ctx.lineTo(15, -145);
        ctx.moveTo(15, -155); ctx.lineTo(5, -145);
        ctx.stroke();
        
        // Cannons (Ports)
        ctx.fillStyle = '#000';
        for(let i=0; i<3; i++) {
            ctx.beginPath();
            ctx.arc(-30 + (i*30), 0, 5, 0, Math.PI*2);
            ctx.fill();
        }

        ctx.restore();
    }

    function drawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.life--;
            p.x += p.vx;
            p.y += p.vy;
            p.size *= 0.95;

            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();

            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function drawCannonballs() {
        ctx.fillStyle = '#111';
        for (let i = cannonballs.length - 1; i >= 0; i--) {
            let b = cannonballs[i];
            b.x += b.vx;
            b.y += b.vy;
            b.vy += 0.1; // Gravity
            b.life--;

            ctx.beginPath();
            ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
            ctx.fill();

            // Splash if hits water
            const waterLevel = getWaterHeight(b.x + (time * ship.speed * 5));
            if (b.y > waterLevel) {
                // Create splash
                for(let k=0; k<8; k++) {
                    particles.push({
                        x: b.x,
                        y: b.y,
                        vx: (Math.random() - 0.5) * 4,
                        vy: -Math.random() * 5,
                        life: 30,
                        size: Math.random() * 4,
                        color: '#fff',
                        type: 'splash'
                    });
                }
                cannonballs.splice(i, 1);
            } else if (b.life <= 0 || b.x > width) {
                cannonballs.splice(i, 1);
            }
        }
    }

    // --- Main Loop ---

    function loop() {
        // Update Time
        time += 1;
        uiSpeed.innerText = Math.abs(ship.speed * 5).toFixed(1);

        // Clear
        ctx.clearRect(0, 0, width, height);

        // Draw
        drawSky();
        
        updatePhysics();
        drawShip();
        drawCannonballs();
        drawParticles();
        
        // Draw water last to cover bottom of ship
        drawWater();

        requestAnimationFrame(loop);
    }

    loop();

</script>
</body>
</html>
