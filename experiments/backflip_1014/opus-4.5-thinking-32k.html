<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slow-Motion Backflip Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    h1 {
      color: #e0e1dd;
      margin-bottom: 15px;
      font-weight: 300;
      letter-spacing: 2px;
    }
    #container {
      background: rgba(0,0,0,0.3);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      border-radius: 10px;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0,180,216,0.4);
    }
    .btn-secondary {
      background: linear-gradient(135deg, #778da9 0%, #415a77 100%);
      color: white;
    }
    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(119,141,169,0.4);
    }
    .info-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
    }
    .info-item {
      text-align: center;
    }
    .info-label {
      color: #778da9;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .info-value {
      color: #00b4d8;
      font-size: 18px;
      font-weight: 600;
      margin-top: 5px;
    }
    #phase { color: #90e0ef; }
    .physics-note {
      margin-top: 15px;
      padding: 12px;
      background: rgba(144, 224, 239, 0.1);
      border-left: 3px solid #00b4d8;
      border-radius: 5px;
      color: #caf0f8;
      font-size: 12px;
      line-height: 1.6;
    }
    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
      color: #778da9;
    }
    input[type="range"] {
      width: 150px;
      accent-color: #00b4d8;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>STANDING BACKFLIP</h1>
    <canvas id="canvas" width="700" height="450"></canvas>
    
    <div class="controls">
      <button class="btn-primary" onclick="restart()">↺ Restart</button>
      <button class="btn-secondary" onclick="togglePause()">⏯ Pause/Play</button>
      <button class="btn-secondary" onclick="stepFrame()">⏭ Step</button>
    </div>
    
    <div class="speed-control">
      <span>Speed:</span>
      <input type="range" id="speedSlider" min="0.1" max="2" step="0.1" value="0.5">
      <span id="speedValue">0.5x</span>
    </div>
    
    <div class="info-panel">
      <div class="info-item">
        <div class="info-label">Phase</div>
        <div class="info-value" id="phase">Standing</div>
      </div>
      <div class="info-item">
        <div class="info-label">Rotation</div>
        <div class="info-value"><span id="rotation">0</span>°</div>
      </div>
      <div class="info-item">
        <div class="info-label">Angular Velocity</div>
        <div class="info-value"><span id="angVel">0</span>°/s</div>
      </div>
    </div>
    
    <div class="physics-note">
      <strong>Conservation of Angular Momentum:</strong> Notice how the figure spins faster when tucked (smaller moment of inertia) and slower when extended (larger moment of inertia). L = Iω remains constant during flight.
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Body segment lengths
    const BODY = {
      headRadius: 14,
      torsoLength: 50,
      upperArm: 28,
      lowerArm: 25,
      upperLeg: 38,
      lowerLeg: 36,
      foot: 18
    };
    
    const GROUND_Y = 380;
    const DURATION = 4500; // Base duration in ms
    
    let time = 0;
    let paused = false;
    let lastTimestamp = 0;
    let speedMultiplier = 0.5;
    
    // Phase definitions
    const phases = [
      { name: "Standing", start: 0, end: 0.08 },
      { name: "Preparing", start: 0.08, end: 0.18 },
      { name: "Crouching", start: 0.18, end: 0.30 },
      { name: "Takeoff!", start: 0.30, end: 0.38 },
      { name: "Rising - Tucking", start: 0.38, end: 0.48 },
      { name: "Peak - Tight Tuck", start: 0.48, end: 0.68 },
      { name: "Falling - Opening", start: 0.68, end: 0.80 },
      { name: "Landing", start: 0.80, end: 0.90 },
      { name: "Recovery", start: 0.90, end: 1.0 }
    ];
    
    // Keyframes: [time, hipX, hipY, bodyRot, torsoLean, hipAngle, kneeAngle, armAngle, elbowAngle]
    // hipY: height of hip above ground
    // bodyRot: overall body rotation (0=upright, 360=full flip)
    // Positive angles = flexion/forward movement relative to parent
    const keyframes = [
      // Standing
      { t: 0.00, x: 300, y: 73, rot: 0,   torso: 0,  hip: 0,   knee: 0,   arm: 15,  elbow: 8 },
      // Preparation - arms swing back
      { t: 0.10, x: 300, y: 71, rot: 0,   torso: 8,  hip: 12,  knee: 18,  arm: -45, elbow: 25 },
      // Deep crouch
      { t: 0.22, x: 300, y: 45, rot: -8,  torso: 30, hip: 65,  knee: 120, arm: -75, elbow: 35 },
      // Deepest crouch
      { t: 0.28, x: 300, y: 38, rot: -5,  torso: 35, hip: 75,  knee: 135, arm: -85, elbow: 40 },
      // Explosive extension - takeoff
      { t: 0.34, x: 305, y: 70, rot: 20,  torso: -20, hip: 15, knee: 25,  arm: 170, elbow: 15 },
      // Leaving ground
      { t: 0.38, x: 315, y: 100, rot: 50, torso: -15, hip: -15, knee: 10, arm: 190, elbow: 10 },
      // Ascending - starting tuck
      { t: 0.44, x: 330, y: 150, rot: 95, torso: 15, hip: 90, knee: 110,  arm: 80,  elbow: 100 },
      // Tight tuck - maximum angular velocity
      { t: 0.52, x: 345, y: 175, rot: 160, torso: 35, hip: 140, knee: 150, arm: 35, elbow: 140 },
      // Still tucked
      { t: 0.60, x: 355, y: 170, rot: 220, torso: 35, hip: 140, knee: 150, arm: 35, elbow: 140 },
      // Beginning to open
      { t: 0.68, x: 365, y: 155, rot: 280, torso: 20, hip: 100, knee: 110, arm: 50, elbow: 80 },
      // Opening - spotting landing
      { t: 0.75, x: 375, y: 120, rot: 320, torso: 5, hip: 50, knee: 55,   arm: 35, elbow: 35 },
      // Extended for landing
      { t: 0.82, x: 382, y: 85, rot: 350, torso: 0, hip: 25, knee: 30,    arm: 25, elbow: 20 },
      // Impact - absorbing
      { t: 0.88, x: 385, y: 55, rot: 360, torso: 25, hip: 55, knee: 85,   arm: 45, elbow: 30 },
      // Recovery
      { t: 0.94, x: 385, y: 68, rot: 360, torso: 10, hip: 18, knee: 25,   arm: 30, elbow: 15 },
      // Final stand
      { t: 1.00, x: 385, y: 73, rot: 360, torso: 0, hip: 0, knee: 0,      arm: 15, elbow: 8 }
    ];
    
    // Interpolate between keyframes with easing
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }
    
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    
    function getState(normalizedTime) {
      const t = Math.max(0, Math.min(1, normalizedTime));
      
      let k1 = keyframes[0];
      let k2 = keyframes[1];
      
      for (let i = 0; i < keyframes.length - 1; i++) {
        if (t >= keyframes[i].t && t <= keyframes[i + 1].t) {
          k1 = keyframes[i];
          k2 = keyframes[i + 1];
          break;
        }
      }
      
      if (t >= keyframes[keyframes.length - 1].t) {
        return { ...keyframes[keyframes.length - 1] };
      }
      
      const segmentT = (t - k1.t) / (k2.t - k1.t);
      const eased = easeInOutCubic(segmentT);
      
      return {
        x: lerp(k1.x, k2.x, eased),
        y: lerp(k1.y, k2.y, eased),
        rot: lerp(k1.rot, k2.rot, eased),
        torso: lerp(k1.torso, k2.torso, eased),
        hip: lerp(k1.hip, k2.hip, eased),
        knee: lerp(k1.knee, k2.knee, eased),
        arm: lerp(k1.arm, k2.arm, eased),
        elbow: lerp(k1.elbow, k2.elbow, eased)
      };
    }
    
    function deg2rad(deg) {
      return deg * Math.PI / 180;
    }
    
    function calculateJoints(state) {
      const hipX = state.x;
      const hipY = GROUND_Y - state.y;
      
      // Body rotation affects everything
      const bodyRot = deg2rad(state.rot);
      
      // Torso goes UP from hip (negative Y in screen coords when upright)
      // Base angle pointing up is -PI/2, then we add body rotation and torso lean
      const torsoAngle = -Math.PI/2 + bodyRot + deg2rad(state.torso);
      const shoulderX = hipX + Math.cos(torsoAngle) * BODY.torsoLength;
      const shoulderY = hipY + Math.sin(torsoAngle) * BODY.torsoLength;
      
      // Head at top of torso
      const headX = shoulderX + Math.cos(torsoAngle) * (BODY.headRadius + 5);
      const headY = shoulderY + Math.sin(torsoAngle) * (BODY.headRadius + 5);
      
      // Legs go DOWN from hip
      // Base angle pointing down is PI/2, add body rotation, subtract hip flexion
      const upperLegAngle = Math.PI/2 + bodyRot - deg2rad(state.hip);
      const kneeX = hipX + Math.cos(upperLegAngle) * BODY.upperLeg;
      const kneeY = hipY + Math.sin(upperLegAngle) * BODY.upperLeg;
      
      // Lower leg continues from knee
      // Add knee flexion (bending back of lower leg)
      const lowerLegAngle = upperLegAngle + deg2rad(state.knee);
      const ankleX = kneeX + Math.cos(lowerLegAngle) * BODY.lowerLeg;
      const ankleY = kneeY + Math.sin(lowerLegAngle) * BODY.lowerLeg;
      
      // Foot
      const footAngle = lowerLegAngle - Math.PI/6;
      const toeX = ankleX + Math.cos(footAngle) * BODY.foot;
      const toeY = ankleY + Math.sin(footAngle) * BODY.foot;
      
      // Arms from shoulders
      // Start pointing down relative to torso, add arm angle
      const upperArmAngle = torsoAngle + Math.PI - deg2rad(state.arm);
      const elbowX = shoulderX + Math.cos(upperArmAngle) * BODY.upperArm;
      const elbowY = shoulderY + Math.sin(upperArmAngle) * BODY.upperArm;
      
      // Lower arm
      const lowerArmAngle = upperArmAngle + deg2rad(state.elbow);
      const handX = elbowX + Math.cos(lowerArmAngle) * BODY.lowerArm;
      const handY = elbowY + Math.sin(lowerArmAngle) * BODY.lowerArm;
      
      return {
        hip: { x: hipX, y: hipY },
        shoulder: { x: shoulderX, y: shoulderY },
        head: { x: headX, y: headY },
        knee: { x: kneeX, y: kneeY },
        ankle: { x: ankleX, y: ankleY },
        toe: { x: toeX, y: toeY },
        elbow: { x: elbowX, y: elbowY },
        hand: { x: handX, y: handY }
      };
    }
    
    function drawStickFigure(joints, alpha = 1, color = '#e0e1dd') {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      // Torso
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(joints.hip.x, joints.hip.y);
      ctx.lineTo(joints.shoulder.x, joints.shoulder.y);
      ctx.stroke();
      
      // Head
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(joints.head.x, joints.head.y, BODY.headRadius, 0, Math.PI * 2);
      ctx.stroke();
      
      // Upper leg
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(joints.hip.x, joints.hip.y);
      ctx.lineTo(joints.knee.x, joints.knee.y);
      ctx.stroke();
      
      // Lower leg
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(joints.knee.x, joints.knee.y);
      ctx.lineTo(joints.ankle.x, joints.ankle.y);
      ctx.stroke();
      
      // Foot
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(joints.ankle.x, joints.ankle.y);
      ctx.lineTo(joints.toe.x, joints.toe.y);
      ctx.stroke();
      
      // Upper arm
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(joints.shoulder.x, joints.shoulder.y);
      ctx.lineTo(joints.elbow.x, joints.elbow.y);
      ctx.stroke();
      
      // Lower arm
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(joints.elbow.x, joints.elbow.y);
      ctx.lineTo(joints.hand.x, joints.hand.y);
      ctx.stroke();
      
      // Joint highlights
      ctx.fillStyle = '#00b4d8';
      const jointRadius = 5;
      [joints.hip, joints.shoulder, joints.knee, joints.ankle, joints.elbow].forEach(j => {
        ctx.beginPath();
        ctx.arc(j.x, j.y, jointRadius, 0, Math.PI * 2);
        ctx.fill();
      });
      
      ctx.restore();
    }
    
    function drawGround() {
      // Main ground line
      const gradient = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 70);
      gradient.addColorStop(0, '#1b263b');
      gradient.addColorStop(1, '#0d1b2a');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, GROUND_Y, canvas.width, 70);
      
      ctx.strokeStyle = '#415a77';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();
      
      // Ground texture
      ctx.strokeStyle = '#2d3f54';
      ctx.lineWidth = 1;
      for (let x = 20; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y + 10);
        ctx.lineTo(x + 20, GROUND_Y + 10);
        ctx.stroke();
      }
    }
    
    function drawTrajectory(normalizedTime) {
      // Draw parabolic trajectory
      ctx.strokeStyle = 'rgba(0, 180, 216, 0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      
      for (let t = 0.35; t <= 0.85; t += 0.01) {
        const state = getState(t);
        const joints = calculateJoints(state);
        if (t === 0.35) {
          ctx.moveTo(joints.hip.x, joints.hip.y);
        } else {
          ctx.lineTo(joints.hip.x, joints.hip.y);
        }
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    
    function drawMotionTrail(normalizedTime) {
      const trailCount = 8;
      for (let i = trailCount; i >= 1; i--) {
        const trailT = normalizedTime - i * 0.03;
        if (trailT > 0.3 && trailT < 0.88) { // Only during the flip
          const trailState = getState(trailT);
          const trailJoints = calculateJoints(trailState);
          const alpha = (1 - i / trailCount) * 0.25;
          drawStickFigure(trailJoints, alpha, '#00b4d8');
        }
      }
    }
    
    function getCurrentPhase(t) {
      for (const phase of phases) {
        if (t >= phase.start && t < phase.end) {
          return phase.name;
        }
      }
      return "Complete";
    }
    
    function getAngularVelocity(t) {
      const dt = 0.005;
      const t1 = Math.max(0, t - dt);
      const t2 = Math.min(1, t + dt);
      const s1 = getState(t1);
      const s2 = getState(t2);
      return Math.abs((s2.rot - s1.rot) / (t2 - t1)) * (1000 / DURATION) * speedMultiplier;
    }
    
    function drawAngularMomentumIndicator(normalizedTime) {
      const angVel = getAngularVelocity(normalizedTime);
      const maxVel = 800;
      const barWidth = 100;
      const barHeight = 10;
      const x = 580;
      const y = 30;
      
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(x, y, barWidth, barHeight);
      
      const fillWidth = Math.min(1, angVel / maxVel) * barWidth;
      const hue = 180 + (angVel / maxVel) * 30;
      ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
      ctx.fillRect(x, y, fillWidth, barHeight);
      
      ctx.strokeStyle = '#778da9';
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, barWidth, barHeight);
      
      ctx.fillStyle = '#e0e1dd';
      ctx.font = '10px sans-serif';
      ctx.fillText('Spin Rate', x, y - 5);
    }
    
    function render(normalizedTime) {
      // Clear canvas
      ctx.fillStyle = '#0d1b2a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Background gradient
      const bgGrad = ctx.createRadialGradient(350, 200, 50, 350, 200, 400);
      bgGrad.addColorStop(0, '#1b263b');
      bgGrad.addColorStop(1, '#0d1b2a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw trajectory arc
      drawTrajectory(normalizedTime);
      
      // Draw ground
      drawGround();
      
      // Draw shadow
      const state = getState(normalizedTime);
      const joints = calculateJoints(state);
      const shadowScale = Math.max(0.2, Math.min(1, 1 - (GROUND_Y - joints.hip.y) / 200));
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(joints.hip.x, GROUND_Y + 3, 25 * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Draw motion trail
      drawMotionTrail(normalizedTime);
      
      // Draw main figure
      drawStickFigure(joints, 1, '#e0e1dd');
      
      // Draw angular momentum indicator
      drawAngularMomentumIndicator(normalizedTime);
      
      // Update UI
      document.getElementById('phase').textContent = getCurrentPhase(normalizedTime);
      document.getElementById('rotation').textContent = Math.round(state.rot);
      document.getElementById('angVel').textContent = Math.round(getAngularVelocity(normalizedTime));
    }
    
    function animate(timestamp) {
      if (lastTimestamp === 0) lastTimestamp = timestamp;
      
      if (!paused) {
        const dt = timestamp - lastTimestamp;
        time += dt * speedMultiplier;
      }
      lastTimestamp = timestamp;
      
      if (time > DURATION) {
        time = 0;
      }
      
      const normalizedTime = time / DURATION;
      render(normalizedTime);
      
      requestAnimationFrame(animate);
    }
    
    function restart() {
      time = 0;
      lastTimestamp = 0;
      paused = false;
    }
    
    function togglePause() {
      paused = !paused;
    }
    
    function stepFrame() {
      if (!paused) paused = true;
      time += 50;
      if (time > DURATION) time = 0;
    }
    
    // Speed slider
    document.getElementById('speedSlider').addEventListener('input', (e) => {
      speedMultiplier = parseFloat(e.target.value);
      document.getElementById('speedValue').textContent = speedMultiplier.toFixed(1) + 'x';
    });
    
    // Start animation
    requestAnimationFrame(animate);
  </script>
</body>
</html>
