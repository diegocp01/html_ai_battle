<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stick Figure Backflip (Slow Motion)</title>
  <style>
    :root{
      --bg1:#0b0f1a;
      --bg2:#0a1024;
      --panel:rgba(15, 22, 45, 0.78);
      --text:#e9efff;
      --muted:#aab6e8;
      --accent:#7ee0ff;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;}
    #wrap{position:fixed;inset:0;}
    canvas{position:absolute;inset:0;width:100%;height:100%;}
    .ui{
      position:absolute;left:16px;top:16px;
      background:var(--panel);
      color:var(--text);
      border:1px solid rgba(255,255,255,0.10);
      border-radius:14px;
      padding:12px 12px 10px;
      box-shadow:0 10px 35px rgba(0,0,0,0.35);
      backdrop-filter:blur(10px);
      min-width:290px;
      user-select:none;
    }
    .row{display:flex;gap:10px;align-items:center;margin:8px 0;}
    .row label{font-size:12px;color:var(--muted);min-width:88px;}
    .row input[type="range"]{width:170px;}
    .row button{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.14);
      color:var(--text);
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
    }
    .row button:hover{border-color:rgba(126,224,255,0.55)}
    .stats{
      margin-top:8px;
      padding-top:8px;
      border-top:1px solid rgba(255,255,255,0.10);
      font-size:12px;
      color:var(--muted);
      line-height:1.55;
    }
    .stats b{color:var(--text);font-weight:600;}
    .pill{
      display:inline-block;
      padding:2px 8px;
      border-radius:999px;
      background:rgba(126,224,255,0.12);
      border:1px solid rgba(126,224,255,0.25);
      color:var(--text);
      font-size:11px;
      margin-left:6px;
      vertical-align:middle;
    }
    .hint{
      position:absolute;right:16px;bottom:14px;
      color:rgba(233,239,255,0.7);
      font-size:12px;
      background:rgba(0,0,0,0.20);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:12px;
      padding:8px 10px;
      max-width:360px;
    }
    .hint kbd{
      background:rgba(255,255,255,0.09);
      border:1px solid rgba(255,255,255,0.14);
      border-bottom-color:rgba(255,255,255,0.22);
      padding:1px 6px;
      border-radius:7px;
      color:var(--text);
      font-size:11px;
    }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div class="ui">
    <div class="row">
      <button id="restart">Restart</button>
      <button id="pause">Pause</button>
      <span class="pill" id="phasePill">ground</span>
    </div>

    <div class="row">
      <label>Speed</label>
      <input id="speed" type="range" min="0.10" max="1.00" step="0.01" value="0.35">
      <span id="speedVal" style="font-size:12px;color:var(--text)">0.35×</span>
    </div>

    <div class="row">
      <label>Jump power</label>
      <input id="jump" type="range" min="780" max="1250" step="5" value="1020">
      <span id="jumpVal" style="font-size:12px;color:var(--text)">1020</span>
    </div>

    <div class="row">
      <label>Show guides</label>
      <input id="guides" type="checkbox" checked>
      <span style="font-size:12px;color:var(--muted)">COM, velocity, ω</span>
    </div>

    <div class="stats" id="stats"></div>
  </div>

  <div class="hint">
    Physics: angular momentum <b>L</b> is conserved <b>in the air</b>. When the figure tucks, inertia <b>I</b> drops, so spin rate <b>ω = L / I</b> increases.
    <div style="margin-top:6px">Keys: <kbd>R</kbd> restart, <kbd>Space</kbd> pause</div>
  </div>
</div>

<script>
(() => {
  // ---------- Canvas + world transform ----------
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  function resize() {
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize, { passive: true });
  resize();

  // World coordinates: x right, y up. Ground is y = 0.
  const marginBottom = 90; // screen pixels
  function setWorldTransform() {
    // Put world origin near bottom-center.
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.translate(innerWidth * 0.50, innerHeight - marginBottom);
    ctx.scale(1, -1);
  }

  // ---------- UI ----------
  const elRestart = document.getElementById("restart");
  const elPause = document.getElementById("pause");
  const elSpeed = document.getElementById("speed");
  const elSpeedVal = document.getElementById("speedVal");
  const elJump = document.getElementById("jump");
  const elJumpVal = document.getElementById("jumpVal");
  const elGuides = document.getElementById("guides");
  const elStats = document.getElementById("stats");
  const elPhasePill = document.getElementById("phasePill");

  let speed = parseFloat(elSpeed.value);
  elSpeedVal.textContent = speed.toFixed(2) + "×";
  elSpeed.addEventListener("input", () => {
    speed = parseFloat(elSpeed.value);
    elSpeedVal.textContent = speed.toFixed(2) + "×";
  });

  let jumpVel = parseFloat(elJump.value);
  elJumpVal.textContent = String(jumpVel | 0);
  elJump.addEventListener("input", () => {
    jumpVel = parseFloat(elJump.value);
    elJumpVal.textContent = String(jumpVel | 0);
    // Replan so the flip stays “one rotation” for the new jump power.
    plannedL = planAngularMomentum(flightTimeFromJump(jumpVel));
  });

  let showGuides = true;
  elGuides.addEventListener("change", () => showGuides = elGuides.checked);

  let paused = false;
  elPause.addEventListener("click", () => { paused = !paused; elPause.textContent = paused ? "Resume" : "Pause"; });

  addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); paused = !paused; elPause.textContent = paused ? "Resume" : "Pause"; }
    if (e.key.toLowerCase() === "r") restart();
  });

  elRestart.addEventListener("click", restart);

  // ---------- Math helpers ----------
  const TAU = Math.PI * 2;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (t) => t * t * (3 - 2 * t);
  const deg = (d) => d * Math.PI / 180;

  function rot(p, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return { x: p.x * c - p.y * s, y: p.x * s + p.y * c };
  }
  function add(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
  function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }
  function mul(a, k) { return { x: a.x * k, y: a.y * k }; }
  function len2(a) { return a.x * a.x + a.y * a.y; }

  // ---------- Flip physics ----------
  // Use pixel-units physics, tuned to look nice on-screen.
  const g = 1750;            // px/s^2
  const vxTakeoff = -95;     // px/s (slight backward drift)
  const substeps = 4;

  function flightTimeFromJump(v0) {
    // Approx flight time if takeoff/landing height match (close enough for this demo).
    return (2 * v0) / g;
  }

  // ---------- Skeleton definition ----------
  const L = {
    torso: 84,
    neck: 12,
    headR: 14,
    upperArm: 44,
    foreArm: 40,
    thigh: 54,
    shin: 54,
    foot: 28,
    shoulderW: 30,
    pelvisW: 18,
  };

  // Mass weights (relative). Used for COM and inertia.
  const M = {
    torso: 12,
    head: 6,
    upperArm: 2,
    foreArm: 1.4,
    thigh: 4,
    shin: 3,
    foot: 1,
  };

  // Pose returns angles for joints (in degrees or derived).
  // Convention (world x right, y up):
  // - thigh angle: -90° is straight down; increasing raises knee forward (+x).
  // - kneeFlex: 0° straight; larger flex pulls ankle forward/up (tuck).
  // - upperArm angle: -90° down; +90° up; 0° forward.
  function groundPose(t) {
    const stand = 0.40;
    const crouchDur = 1.10;
    const takeoffDur = 0.34;
    const tCrouch0 = stand;
    const tTake0 = stand + crouchDur;
    const tLaunch = tTake0 + takeoffDur;

    // Default upright.
    let hipFlex = 0, kneeFlex = 0, torsoLean = 0;
    let upperArm = -75, elbowFlex = 20;

    if (t < tCrouch0) {
      // small settle
      const p = smoothstep(clamp(t / stand, 0, 1));
      hipFlex = lerp(0, 6, p);
      kneeFlex = lerp(0, 10, p);
      torsoLean = lerp(0, -3, p);
      upperArm = lerp(-75, -88, p);
      elbowFlex = lerp(20, 25, p);
    } else if (t < tTake0) {
      // Crouch
      const p = smoothstep(clamp((t - tCrouch0) / crouchDur, 0, 1));
      hipFlex = lerp(0, 34, p);
      kneeFlex = lerp(0, 78, p);
      torsoLean = lerp(0, -10, p);
      // arms swing back to load
      upperArm = lerp(-75, 175, p);     // swing behind (wraps around past 180)
      elbowFlex = lerp(20, 40, p);
    } else if (t < tLaunch) {
      // Extension + arm swing up (generates lift and rotation)
      const p = smoothstep(clamp((t - tTake0) / takeoffDur, 0, 1));
      hipFlex = lerp(34, 0, p);
      kneeFlex = lerp(78, 0, p);
      torsoLean = lerp(-10, 14, p);      // slight lean back for backflip
      upperArm = lerp(175, 95, p);       // arms up overhead
      elbowFlex = lerp(40, 12, p);
    }

    return {
      torsoLeanDeg: torsoLean,
      hipFlexDeg: hipFlex,
      kneeFlexDeg: kneeFlex,
      // Feet flat on ground while grounded
      footAngleDeg: 0,
      upperArmDeg: upperArm,
      elbowFlexDeg: elbowFlex,
      phaseEndLaunch: tLaunch
    };
  }

  function airPose(airT, flightT) {
    // Tuck schedule: ramp in, hold, open.
    const u = clamp(airT / flightT, 0, 1);

    const tuckIn0 = 0.10, tuckIn1 = 0.38;
    const hold1  = 0.62;
    const open1  = 0.86;

    let tuck = 0;
    if (u < tuckIn0) tuck = 0;
    else if (u < tuckIn1) tuck = smoothstep((u - tuckIn0) / (tuckIn1 - tuckIn0));
    else if (u < hold1) tuck = 1;
    else if (u < open1) tuck = 1 - smoothstep((u - hold1) / (open1 - hold1));
    else tuck = 0;

    // Joint angles from tuck factor.
    const hipFlex = lerp(0, 112, tuck);
    const kneeFlex = lerp(0, 128, tuck);

    // Arms: overhead at takeoff, then grab shins in tuck, then forward for landing.
    const armToTuck = lerp(95, 20, tuck);     // move arms in
    const elbow = lerp(12, 118, tuck);

    // To “stick” landing: add a small knee bend late.
    const landPrep = smoothstep(clamp((u - 0.86) / 0.14, 0, 1));
    const kneeLandBend = lerp(0, 32, landPrep);
    const hipLandBend = lerp(0, 10, landPrep);

    return {
      torsoLeanDeg: lerp(10, 0, smoothstep(clamp((u - 0.25) / 0.75, 0, 1))),
      hipFlexDeg: hipFlex + hipLandBend,
      kneeFlexDeg: Math.max(kneeFlex, kneeLandBend),
      // Point toes in the air
      footAngleDeg: lerp(-40, -10, landPrep),
      upperArmDeg: lerp(armToTuck, 12, landPrep),
      elbowFlexDeg: lerp(elbow, 35, landPrep),
      tuckFactor: tuck,
      u
    };
  }

  // Build skeleton points + segments, compute COM and inertia in body-local coordinates.
  // Body-local origin is pelvis center.
  function buildSkeleton(pose) {
    const torsoAng = Math.PI / 2 + deg(pose.torsoLeanDeg);

    const pelvis = { x: 0, y: 0 };

    const shoulderC = add(pelvis, { x: Math.cos(torsoAng) * L.torso, y: Math.sin(torsoAng) * L.torso });
    const neck = add(shoulderC, { x: Math.cos(torsoAng) * L.neck, y: Math.sin(torsoAng) * L.neck });
    const headC = add(neck, { x: Math.cos(torsoAng) * (L.headR * 0.9), y: Math.sin(torsoAng) * (L.headR * 0.9) });

    // Shoulder and hip offsets (simple 2D depth effect)
    const torsoRight = { x: Math.cos(torsoAng - Math.PI/2), y: Math.sin(torsoAng - Math.PI/2) };
    const shOff = mul(torsoRight, L.shoulderW * 0.5);

    const hipNear = { x: +L.pelvisW * 0.45, y: 0 };
    const hipFar  = { x: -L.pelvisW * 0.45, y: 0 };

    const shoulderNear = add(shoulderC, shOff);
    const shoulderFar  = sub(shoulderC, shOff);

    // Arms (absolute angles)
    const upperArmAng = deg(pose.upperArmDeg);
    const elbowFlex = deg(pose.elbowFlexDeg);

    // Bend forearm “toward” the body: choose direction based on upper arm angle quadrant.
    const bendDir = (Math.cos(upperArmAng) >= 0) ? 1 : -1;
    const foreArmAng = upperArmAng + bendDir * elbowFlex;

    function armFromShoulder(S) {
      const E = add(S, { x: Math.cos(upperArmAng) * L.upperArm, y: Math.sin(upperArmAng) * L.upperArm });
      const W = add(E, { x: Math.cos(foreArmAng) * L.foreArm, y: Math.sin(foreArmAng) * L.foreArm });
      return { S, E, W };
    }

    const armN = armFromShoulder(shoulderNear);
    const armF = armFromShoulder(shoulderFar);

    // Legs
    const hipFlex = deg(pose.hipFlexDeg);
    const kneeFlex = deg(pose.kneeFlexDeg);

    // Thigh angle baseline is straight down (-90°). Flex raises knee forward (+x).
    const thighAng = -Math.PI / 2 + hipFlex;
    const shinAng = thighAng + kneeFlex;

    // Foot angle: flat on ground when grounded, otherwise toes pointed a bit
    const footAng = deg(pose.footAngleDeg);

    function legFromHip(H) {
      const K = add(H, { x: Math.cos(thighAng) * L.thigh, y: Math.sin(thighAng) * L.thigh });
      const A = add(K, { x: Math.cos(shinAng) * L.shin, y: Math.sin(shinAng) * L.shin });

      // Heel and toe
      const heel = add(A, { x: Math.cos(footAng) * (-L.foot * 0.28), y: Math.sin(footAng) * (-L.foot * 0.28) });
      const toe  = add(A, { x: Math.cos(footAng) * ( L.foot * 1.00), y: Math.sin(footAng) * ( L.foot * 1.00) });

      return { H, K, A, heel, toe };
    }

    const legN = legFromHip(hipNear);
    const legF = legFromHip(hipFar);

    // Collect segments with masses (midpoint mass model).
    const segs = [];

    function addSeg(a, b, m, name) { segs.push({ a, b, m, name }); }

    addSeg(pelvis, shoulderC, M.torso, "torso");
    // head as a mass at head center
    segs.push({ a: headC, b: headC, m: M.head, name: "head" });

    function addArmSeg(arm, side) {
      addSeg(arm.S, arm.E, M.upperArm, `upperArm_${side}`);
      addSeg(arm.E, arm.W, M.foreArm, `foreArm_${side}`);
    }
    addArmSeg(armN, "near");
    addArmSeg(armF, "far");

    function addLegSeg(leg, side) {
      addSeg(leg.H, leg.K, M.thigh, `thigh_${side}`);
      addSeg(leg.K, leg.A, M.shin,  `shin_${side}`);
      addSeg(leg.heel, leg.toe, M.foot, `foot_${side}`);
    }
    addLegSeg(legN, "near");
    addLegSeg(legF, "far");

    // Compute COM (weighted midpoint average)
    let mSum = 0;
    let c = { x: 0, y: 0 };
    for (const s of segs) {
      const mid = { x: (s.a.x + s.b.x) * 0.5, y: (s.a.y + s.b.y) * 0.5 };
      c.x += mid.x * s.m;
      c.y += mid.y * s.m;
      mSum += s.m;
    }
    c.x /= mSum;
    c.y /= mSum;

    // Inertia about COM (point-mass at each segment midpoint)
    let I = 0;
    for (const s of segs) {
      const mid = { x: (s.a.x + s.b.x) * 0.5, y: (s.a.y + s.b.y) * 0.5 };
      const r = sub(mid, c);
      I += s.m * len2(r);
    }
    // Keep inertia in a reasonable numeric range
    I = Math.max(I, 1e-3);

    // Joints (for drawing circles)
    const joints = {
      pelvis,
      shoulderC,
      shoulderNear, shoulderFar,
      elbowNear: armN.E, elbowFar: armF.E,
      wristNear: armN.W, wristFar: armF.W,
      hipNear: legN.H, hipFar: legF.H,
      kneeNear: legN.K, kneeFar: legF.K,
      ankleNear: legN.A, ankleFar: legF.A,
      headC
    };

    // Feet contact candidates in body-local coords
    const feet = [
      legN.heel, legN.toe,
      legF.heel, legF.toe
    ];

    return { segs, comLocal: c, inertia: I, joints, feet };
  }

  // Transform a body-local point to world given COM world position and rotation about COM.
  function toWorld(pLocal, comLocal, theta, comWorld) {
    const q = sub(pLocal, comLocal);
    const r = rot(q, theta);
    return add(comWorld, r);
  }

  function minFootYWorld(skel, theta, comWorld) {
    let minY = Infinity;
    for (const f of skel.feet) {
      const w = toWorld(f, skel.comLocal, theta, comWorld);
      if (w.y < minY) minY = w.y;
    }
    return minY;
  }

  function groundCOMY(skel) {
    // When theta=0: worldY = comWorldY + (p.y - comLocal.y).
    // Need min feet y to be 0.
    let minY = Infinity;
    for (const f of skel.feet) {
      const y = (f.y - skel.comLocal.y);
      if (y < minY) minY = y;
    }
    return -minY;
  }

  // Plan L so the integrated rotation during flight is about -2π, using ω = L/I(t)
  // and pose-based inertia. This makes the tuck visibly speed up the rotation.
  function planAngularMomentum(flightT) {
    const dt = 1 / 720;
    let A = 0;
    for (let t = 0; t < flightT; t += dt) {
      const pose = airPose(t, flightT);
      const skel = buildSkeleton(pose);
      A += (1 / skel.inertia) * dt;
    }
    // Target: one full backflip, clockwise (negative).
    return (-TAU) / A;
  }

  // ---------- Simulation state ----------
  let simT = 0;
  let state = "ground"; // ground | air | landing | done
  let airT = 0;
  let launchT = 0;

  let comWorld = { x: 0, y: 0 };
  let v = { x: 0, y: 0 };

  let theta = 0;    // body rotation
  let omega = 0;    // angular velocity
  let Lconst = 0;   // angular momentum in air (constant there)

  let flightT = flightTimeFromJump(jumpVel);
  let plannedL = planAngularMomentum(flightT);

  let landingTimer = 0;

  function restart() {
    simT = 0;
    state = "ground";
    airT = 0;
    launchT = 0;
    comWorld = { x: 0, y: 0 };
    v = { x: 0, y: 0 };
    theta = 0;
    omega = 0;
    Lconst = 0;
    landingTimer = 0;

    flightT = flightTimeFromJump(jumpVel);
    plannedL = planAngularMomentum(flightT);

    elPhasePill.textContent = "ground";
  }

  restart();

  // ---------- Step ----------
  function step(dt) {
    simT += dt;

    // Build pose and skeleton each step because inertia depends on pose.
    if (state === "ground") {
      const pose = groundPose(simT);
      const skel = buildSkeleton(pose);

      // Keep feet planted (theta = 0 on ground for this demo).
      theta = 0;
      omega = 0;

      comWorld.x = 0;
      comWorld.y = groundCOMY(skel);

      // Launch moment
      launchT = pose.phaseEndLaunch;
      if (simT >= launchT) {
        state = "air";
        airT = 0;
        v.x = vxTakeoff;
        v.y = jumpVel;

        // Set L to achieve ~1 rotation over the flight, given changing inertia.
        flightT = flightTimeFromJump(jumpVel);
        plannedL = planAngularMomentum(flightT);
        Lconst = plannedL;

        // Start with current inertia
        omega = Lconst / skel.inertia;

        elPhasePill.textContent = "air";
      }
    }

    else if (state === "air") {
      airT += dt;

      const pose = airPose(airT, flightT);
      const skel = buildSkeleton(pose);

      // Linear motion
      v.y += -g * dt;
      comWorld.x += v.x * dt;
      comWorld.y += v.y * dt;

      // Angular motion with conserved angular momentum in air
      omega = Lconst / skel.inertia;
      theta += omega * dt;

      // Collision check (feet hit ground)
      const minY = minFootYWorld(skel, theta, comWorld);
      const descending = (v.y < 0);

      if (descending && airT > 0.25 && minY <= 0) {
        // Move COM up to remove penetration
        comWorld.y += -minY;

        // Enter landing: stop vertical motion, bleed angular velocity with damping.
        v.y = 0;
        state = "landing";
        landingTimer = 0;
        elPhasePill.textContent = "landing";
      }
    }

    else if (state === "landing") {
      landingTimer += dt;

      // After contact, torque with the ground can change L, so we damp ω toward 0.
      // Also ease θ toward the nearest upright multiple of 2π.
      const flightTarget = -TAU;
      const kRot = 14.0;   // rotational damping
      const kSnap = 9.5;   // upright snap

      // Pose for landing: reuse airPose but push u toward 1
      const fauxAirT = flightT * lerp(0.90, 1.0, smoothstep(clamp(landingTimer / 0.55, 0, 1)));
      const pose = airPose(fauxAirT, flightT);
      const skel = buildSkeleton(pose);

      // Dampen angular velocity
      omega *= Math.exp(-kRot * dt);
      theta += omega * dt;

      // Ease theta to upright one-rotation finish (keeps it readable)
      const err = (flightTarget - theta);
      theta += err * (1 - Math.exp(-kSnap * dt));

      // Keep feet on ground
      const minY = minFootYWorld(skel, theta, comWorld);
      if (minY < 0) comWorld.y += -minY;

      // Small settle (knee bend absorbs landing)
      // Also damp small horizontal drift.
      v.x *= Math.exp(-2.2 * dt);
      comWorld.x += v.x * dt;

      // End
      if (landingTimer > 1.10) {
        state = "done";
        omega = 0;
        theta = flightTarget;
        elPhasePill.textContent = "done";
      }
    }

    else if (state === "done") {
      // Hold final pose on ground.
      const pose = { torsoLeanDeg: 0, hipFlexDeg: 8, kneeFlexDeg: 24, footAngleDeg: 0, upperArmDeg: 10, elbowFlexDeg: 40 };
      const skel = buildSkeleton(pose);
      theta = -TAU;
      omega = 0;
      comWorld.x *= 0.95;
      comWorld.y = groundCOMY(skel);
    }
  }

  // ---------- Rendering ----------
  function drawSegment(a, b, w, alpha=1) {
    ctx.globalAlpha = alpha;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawCircle(p, r, fill=true, alpha=1) {
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, TAU);
    if (fill) ctx.fill(); else ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function render() {
    // Clear screen in screen-space
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    // World transform
    setWorldTransform();

    // Ground
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-innerWidth, 0);
    ctx.lineTo(innerWidth, 0);
    ctx.stroke();

    // Build current pose/skeleton for draw
    let pose, skel;
    if (state === "ground") {
      pose = groundPose(simT);
      skel = buildSkeleton(pose);
    } else if (state === "air") {
      pose = airPose(airT, flightT);
      skel = buildSkeleton(pose);
    } else if (state === "landing") {
      const fauxAirT = flightT * lerp(0.90, 1.0, smoothstep(clamp(landingTimer / 0.55, 0, 1)));
      pose = airPose(fauxAirT, flightT);
      skel = buildSkeleton(pose);
    } else {
      pose = { torsoLeanDeg: 0, hipFlexDeg: 8, kneeFlexDeg: 24, footAngleDeg: 0, upperArmDeg: 10, elbowFlexDeg: 40 };
      skel = buildSkeleton(pose);
    }

    // Transform all joints to world
    function W(pLocal) { return toWorld(pLocal, skel.comLocal, theta, comWorld); }

    // Colors
    ctx.strokeStyle = "rgba(233,239,255,0.95)";
    ctx.fillStyle = "rgba(233,239,255,0.95)";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // Draw far limbs slightly dimmer for depth
    const joints = skel.joints;

    // Draw segments
    for (const s of skel.segs) {
      const a = W(s.a);
      const b = W(s.b);

      const isFar =
        (s.name.includes("_far")) ||
        (s.name.includes("foot_far")) ||
        (s.name.includes("shin_far")) ||
        (s.name.includes("thigh_far"));

      const w = (s.name === "torso") ? 7 : (s.name.startsWith("upperArm") || s.name.startsWith("thigh")) ? 5 : 4;
      drawSegment(a, b, w, isFar ? 0.55 : 1.0);
    }

    // Head (circle)
    const headC = W(joints.headC);
    ctx.fillStyle = "rgba(233,239,255,0.92)";
    drawCircle(headC, L.headR, true, 0.95);

    // Joints (hips, knees, elbows explicitly)
    ctx.fillStyle = "rgba(126,224,255,0.92)";
    const jointR = 4.4;
    const jointRSmall = 3.6;

    // Hips
    drawCircle(W(joints.hipFar), jointR, true, 0.60);
    drawCircle(W(joints.hipNear), jointR, true, 1.00);

    // Knees
    drawCircle(W(joints.kneeFar), jointR, true, 0.60);
    drawCircle(W(joints.kneeNear), jointR, true, 1.00);

    // Elbows
    drawCircle(W(joints.elbowFar), jointR, true, 0.60);
    drawCircle(W(joints.elbowNear), jointR, true, 1.00);

    // Ankles + wrists (extra)
    ctx.fillStyle = "rgba(233,239,255,0.90)";
    drawCircle(W(joints.ankleFar), jointRSmall, true, 0.55);
    drawCircle(W(joints.ankleNear), jointRSmall, true, 1.00);
    drawCircle(W(joints.wristFar), jointRSmall, true, 0.55);
    drawCircle(W(joints.wristNear), jointRSmall, true, 1.00);

    // COM + guides
    if (showGuides) {
      // COM marker
      ctx.fillStyle = "rgba(255, 204, 102, 0.95)";
      drawCircle(comWorld, 3.8, true, 1.0);

      // Velocity vector
      ctx.strokeStyle = "rgba(255, 204, 102, 0.75)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(comWorld.x, comWorld.y);
      ctx.lineTo(comWorld.x + v.x * 0.10, comWorld.y + v.y * 0.10);
      ctx.stroke();

      // Angular velocity text (in screen space)
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "rgba(233,239,255,0.80)";
      ctx.font = "12px ui-sans-serif, system-ui";
      const omegaDeg = omega * 180 / Math.PI;
      ctx.fillText(`ω: ${omegaDeg.toFixed(0)}°/s`, 18, innerHeight - 24);
      setWorldTransform();
    }

    // Stats panel
    const omegaDeg = omega * 180 / Math.PI;
    const revPerSec = Math.abs(omega) / TAU;
    const inertia = skel.inertia;
    const Ldisp = (state === "air") ? Lconst : omega * inertia;

    elPhasePill.textContent = state;
    elStats.innerHTML =
      `<div><b>Angular momentum L</b>: ${Ldisp.toFixed(1)} <span style="opacity:.8">(px²·mass/s)</span> ${state === "air" ? '<span class="pill">conserved</span>' : '<span class="pill">ground torque</span>'}</div>` +
      `<div><b>Inertia I</b>: ${inertia.toFixed(1)} <span style="opacity:.8">(px²·mass)</span></div>` +
      `<div><b>Spin ω</b>: ${omegaDeg.toFixed(0)}°/s (${revPerSec.toFixed(2)} rev/s)</div>` +
      `<div><b>Angle θ</b>: ${(theta * 180/Math.PI).toFixed(0)}°</div>`;
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function loop(now) {
    const rawDt = Math.min(0.033, (now - last) / 1000);
    last = now;

    if (!paused) {
      const dt = rawDt * speed;
      const h = dt / substeps;
      for (let i = 0; i < substeps; i++) step(h);
    }

    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
