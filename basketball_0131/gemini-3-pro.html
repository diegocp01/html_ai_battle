<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Bank Shot Simulation</title>
    <style>
        :root {
            --court-color: #f0e6d2;
            --paint-color: #d25a5a;
            --line-color: #333;
            --ball-color: #ff7b00;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* The Game Container */
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 60%, var(--court-color) 60%);
            border: 4px solid #fff;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: pointer;
            user-select: none;
        }

        /* Floor perspective lines */
        .floor-line {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.4);
            bottom: 0;
        }
        .floor-line.mid { width: 100%; height: 2px; bottom: 20%; }
        .floor-line.paint { width: 140px; height: 40%; background: rgba(210, 90, 90, 0.3); right: 50px; bottom: 0; border-left: 2px solid white; border-right: 2px solid white; }

        /* The Pole */
        #pole {
            position: absolute;
            right: 40px;
            bottom: 40%; /* Starts at floor horizon */
            width: 15px;
            height: 300px; /* extends up */
            background: #444;
            z-index: 1;
        }

        /* The Backboard */
        #backboard {
            position: absolute;
            right: 45px;
            top: 150px;
            width: 10px;
            height: 120px;
            background: #fff;
            border-left: 2px solid #ccc;
            z-index: 2;
        }
        
        /* The decorative square on backboard */
        #backboard::after {
            content: '';
            position: absolute;
            left: -2px;
            top: 70px;
            width: 4px;
            height: 40px;
            background: #f00;
        }

        /* The Rim */
        #rim {
            position: absolute;
            right: 55px;
            top: 230px;
            width: 50px;
            height: 4px;
            background: #ff4500;
            border-radius: 2px;
            z-index: 3;
        }

        /* The Net */
        #net {
            position: absolute;
            right: 58px;
            top: 234px;
            width: 44px;
            height: 40px;
            border-left: 1px solid white;
            border-right: 1px solid white;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 5px,
                rgba(255,255,255,0.6) 5px,
                rgba(255,255,255,0.6) 6px
            ),
            repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 5px,
                rgba(255,255,255,0.6) 5px,
                rgba(255,255,255,0.6) 6px
            );
            /* Trapezoid shape for net */
            clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
            z-index: 4;
            transform-origin: top center;
            transition: transform 0.2s ease;
        }

        /* Net Animation Class */
        .swish-anim {
            animation: netWobble 0.5s ease-out;
        }

        @keyframes netWobble {
            0% { transform: scaleY(1); }
            30% { transform: scaleY(1.3) skewX(5deg); }
            60% { transform: scaleY(0.9) skewX(-5deg); }
            100% { transform: scaleY(1); }
        }

        /* The Ball */
        #ball {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #ff9d00, #d35400);
            border-radius: 50%;
            border: 1px solid #a04000;
            z-index: 5;
            /* Start position */
            left: 100px;
            bottom: 100px;
            /* Lines on ball */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Lines on the ball using pseudo elements */
        #ball::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0,0,0,0.2);
            transform: rotate(45deg);
        }
        #ball::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0,0,0,0.2);
            transform: rotate(-45deg);
        }

        /* Instructions */
        #message {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            text-shadow: 2px 2px 0 #000;
            font-weight: bold;
            pointer-events: none;
        }

        /* Ball shadow */
        #shadow {
            position: absolute;
            width: 30px;
            height: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            left: 100px;
            bottom: 95px;
            z-index: 0;
            transition: transform 0.1s;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="message">Click anywhere to shoot!</div>
    
    <div class="floor-line mid"></div>
    <div class="floor-line paint"></div>
    <div id="pole"></div>
    <div id="backboard"></div>
    <div id="rim"></div>
    <div id="net"></div>

    <div id="ball"></div>
    <div id="shadow"></div>
</div>

<script>
    const container = document.getElementById('game-container');
    const ball = document.getElementById('ball');
    const shadow = document.getElementById('shadow');
    const net = document.getElementById('net');
    const msg = document.getElementById('message');

    // Game Constants
    // Coordinate system: 0,0 is bottom-left of container in CSS logic, 
    // but JS usually works top-left. We will map physics X/Y to CSS left/bottom.
    const GRAVITY = 0.6;
    const AIR_RESISTANCE = 0.995;
    const BOUNCE_DAMPENING = 0.4;
    
    // Target Coordinates (Hit the backboard)
    const BACKBOARD_X = 745; // Just slightly left of the visual backboard
    const HOOP_Y = 230; // Height of rim (from top) -> ~370 from bottom
    const RIM_LEFT = 695;
    const RIM_RIGHT = 745;

    // State
    let isShooting = false;
    let pos = { x: 100, y: 100 }; // Matches CSS bottom/left
    let vel = { x: 0, y: 0 };
    let rotation = 0;
    let animationId;

    // Reset ball to start
    function resetBall() {
        isShooting = false;
        pos = { x: 100, y: 100 };
        vel = { x: 0, y: 0 };
        rotation = 0;
        
        ball.style.left = pos.x + 'px';
        ball.style.bottom = pos.y + 'px';
        ball.style.transform = 'rotate(0deg)';
        shadow.style.left = pos.x + 'px';
        shadow.style.bottom = (pos.y - 5) + 'px';
        shadow.style.opacity = 1;
        shadow.style.transform = 'scale(1)';
        
        net.classList.remove('swish-anim');
        msg.innerText = "Click anywhere to shoot!";
    }

    // Main Physics Loop
    function update() {
        if (!isShooting) return;

        // Apply Forces
        vel.y -= GRAVITY;
        vel.x *= AIR_RESISTANCE;

        // Update Position
        pos.x += vel.x;
        pos.y += vel.y;
        rotation += vel.x * 2; // Spin based on speed

        // Collision Logic: Backboard
        // The backboard is roughly at x=745, between y=350 and y=450 (calculated from CSS top:150px)
        // CSS Top 150px = (600 - 150) = 450px from bottom. Height 120 -> ends at 330px from bottom.
        let backboardBottom = 600 - (150 + 120);
        let backboardTop = 600 - 150;

        // Check if we hit the vertical plane of the backboard
        if (pos.x >= BACKBOARD_X && pos.x <= BACKBOARD_X + 20) {
            if (pos.y >= backboardBottom && pos.y <= backboardTop) {
                // We hit the board!
                // Reverse X velocity (Bounce)
                vel.x = -Math.abs(vel.x) * BOUNCE_DAMPENING;
                // Move ball slightly out to prevent sticking
                pos.x = BACKBOARD_X - 1;
                // Play sound logic here if we had audio
            }
        }

        // Swish Logic: Check if passing through Rim
        // Rim is at CSS Top 230 -> Bottom 370.
        // We check if ball is moving down, is within rim X width, and crosses the Rim Y.
        let rimHeight = 600 - 230;
        
        if (vel.y < 0 && // Falling
            pos.y < rimHeight && pos.y > rimHeight - 20 && // Crossing rim plane
            pos.x > RIM_LEFT && pos.x < RIM_RIGHT // Within horizontal rim area
           ) {
               // Trigger Swish
               if (!net.classList.contains('swish-anim')) {
                   net.classList.add('swish-anim');
                   msg.innerText = "SWISH!";
                   // Center the ball slightly to make it look cleaner
                   vel.x = 0; 
                   pos.x = RIM_LEFT + ((RIM_RIGHT - RIM_LEFT) / 2) - 15; // Center in hoop
               }
        }

        // Floor Collision
        if (pos.y <= 0) {
            pos.y = 0;
            vel.y = -vel.y * 0.6; // Floor bounce dampening
            vel.x = vel.x * 0.8;  // Friction
            
            // Stop if slow enough
            if (Math.abs(vel.y) < 2) {
                vel.y = 0;
                vel.x = 0;
                isShooting = false;
                setTimeout(resetBall, 2000); // Reset after 2 seconds
            }
        }

        // Render Ball
        ball.style.left = pos.x + 'px';
        ball.style.bottom = pos.y + 'px';
        ball.style.transform = `rotate(${rotation}deg)`;

        // Render Shadow
        shadow.style.left = pos.x + 'px';
        // Shadow scales inversely with height to fake depth/height
        let scale = Math.max(0.2, 1 - (pos.y / 600)); 
        shadow.style.transform = `scale(${scale})`;
        shadow.style.opacity = scale;

        animationId = requestAnimationFrame(update);
    }

    // Launch Logic
    container.addEventListener('click', (e) => {
        if (isShooting) return;

        isShooting = true;
        msg.innerText = "...";

        // To guarantee a swish, we need specific physics values.
        // Distance X ~ 645px. Height gain ~ 300px.
        // We set fixed velocities to ensure the "Bank Shot".
        
        vel.x = 11.5; 
        vel.y = 19; 

        // Add a tiny bit of random variation so it doesn't look identical every pixel
        // but keeps the trajectory successful.
        vel.x += (Math.random() - 0.5) * 0.2;
        vel.y += (Math.random() - 0.5) * 0.2;

        update();
    });

</script>

</body>
</html>
